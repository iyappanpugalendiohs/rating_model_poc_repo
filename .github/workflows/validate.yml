name: Validate rating model on Python 3.14
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Show Python version
        run: python --version
      - name: Install dependencies from wheels only
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Verify runtime versions
        run: |
          python -c "import sys, sklearn, joblib; print(sys.version); print('scikit-learn', sklearn.__version__); print('joblib', joblib.__version__)"
      - name: Unit tests
        run: python -m pytest -q
      - name: Build and smoke-test candidate v1 artifact
        run: |
          python src/build_rating_model.py --version 1.0.0 --output-dir artifacts/rating-model-v1
          python src/local_artifact_test.py --model-dir artifacts/rating-model-v1 --request sample_request.json
