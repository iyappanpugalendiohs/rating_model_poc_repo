name: Build and Deploy UE Rating Model

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "azureml/**"
      - "requirements.txt"
      - "sample_request.json"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Checkout GitHub repository
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------------
      # Python 3.14
      # -------------------------------------------------------

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt


      # -------------------------------------------------------
      # Unit tests
      # -------------------------------------------------------

      - name: Run unit tests
        run: |
          python -m pytest -q


      # -------------------------------------------------------
      # Define BUSINESS version
      #
      # Azure ML technical version will be calculated later.
      # Business model stays in V1 family.
      # -------------------------------------------------------

      - name: Define business model version
        id: business_version
        shell: bash
        run: |
          BUSINESS_VERSION="1.0.${GITHUB_RUN_NUMBER}"

          echo "Business model version: $BUSINESS_VERSION"

          echo "version=$BUSINESS_VERSION" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Build model
      # -------------------------------------------------------

      - name: Build Rating Model
        run: |
          mkdir -p artifacts/rating-model

          python src/build_rating_model.py \
            --version "${{ steps.business_version.outputs.version }}" \
            --output-dir artifacts/rating-model


      # -------------------------------------------------------
      # Local artifact test
      # -------------------------------------------------------

      - name: Test built model
        run: |
          python src/local_artifact_test.py \
            --model-dir artifacts/rating-model \
            --request sample_request.json


      # -------------------------------------------------------
      # Login to Azure using GitHub OIDC
      # -------------------------------------------------------

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # -------------------------------------------------------
      # Install Azure ML CLI extension
      # -------------------------------------------------------

      - name: Install Azure ML CLI
        run: |
          az extension add --name ml --yes || true
          az extension update --name ml


      # -------------------------------------------------------
      # Verify Azure context
      # -------------------------------------------------------

      - name: Verify Azure environment
        run: |
          az account set \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

          az account show \
            --query "{Subscription:name,SubscriptionId:id,Tenant:tenantId}" \
            -o table

          az ml workspace show \
            --name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -o table


      # -------------------------------------------------------
      # Determine next Azure ML technical model version
      #
      # Existing:
      # ue-rating-model:1
      #
      # First GitHub deployment:
      # ue-rating-model:2
      # -------------------------------------------------------

      - name: Determine next Azure ML model version
        id: aml_version
        shell: bash
        run: |

          MODEL_NAME="${{ vars.AML_MODEL_NAME }}"

          EXISTING_VERSIONS=$(az ml model list \
            --name "$MODEL_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "[].version" \
            -o tsv || true)

          echo "Existing versions:"
          echo "$EXISTING_VERSIONS"

          if [ -z "$EXISTING_VERSIONS" ]; then

            NEXT_VERSION=1

          else

            LAST_VERSION=$(echo "$EXISTING_VERSIONS" \
              | grep -E '^[0-9]+$' \
              | sort -n \
              | tail -1)

            NEXT_VERSION=$((LAST_VERSION + 1))

          fi

          echo "Next Azure ML model version: $NEXT_VERSION"

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # Register model
      # -------------------------------------------------------

      - name: Register model in Azure ML
        run: |

          echo "Azure ML Model Version:"
          echo "${{ steps.aml_version.outputs.version }}"

          az ml model create \
            --name "${{ vars.AML_MODEL_NAME }}" \
            --version "${{ steps.aml_version.outputs.version }}" \
            --path "artifacts/rating-model" \
            --type custom_model \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --tags \
              businessModelVersion="${{ steps.business_version.outputs.version }}" \
              gitCommit="${{ github.sha }}" \
              githubRun="${{ github.run_id }}" \
              python="3.14" \
              lifecycle="GitHub-CICD"


      # -------------------------------------------------------
      # Show registered model
      # -------------------------------------------------------

      - name: Verify registered model
        run: |

          az ml model show \
            --name "${{ vars.AML_MODEL_NAME }}" \
            --version "${{ steps.aml_version.outputs.version }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -o table


      # -------------------------------------------------------
      # Resolve the model reference registered by this run
      # -------------------------------------------------------

      - name: Define deployment model reference
        id: model_reference
        shell: bash
        run: |
          MODEL_REFERENCE="azureml:${{ vars.AML_MODEL_NAME }}:${{ steps.aml_version.outputs.version }}"

          echo "Model reference: $MODEL_REFERENCE"
          echo "reference=$MODEL_REFERENCE" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # The endpoint must remain stable because APIM points to it.
      # Create/update only the deployment underneath the endpoint.
      # -------------------------------------------------------

      - name: Verify Azure ML endpoint exists
        shell: bash
        run: |
          if ! az ml online-endpoint show \
            --name "${{ vars.AML_ENDPOINT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output none; then

            echo "::error::Azure ML endpoint '${{ vars.AML_ENDPOINT_NAME }}' does not exist."
            echo "::error::This workflow intentionally keeps the endpoint stable because APIM is already configured to use it."
            exit 1
          fi


      # -------------------------------------------------------
      # Determine whether BLUE already exists
      #
      # Existing deployment -> update only the model
      # Missing deployment  -> create BLUE from the deployment YAML
      # -------------------------------------------------------

      - name: Check Azure ML deployment
        id: deployment_state
        shell: bash
        run: |
          if az ml online-deployment show \
            --name "${{ vars.AML_DEPLOYMENT_NAME }}" \
            --endpoint-name "${{ vars.AML_ENDPOINT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output none 2>/dev/null; then

            echo "Deployment '${{ vars.AML_DEPLOYMENT_NAME }}' exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deployment '${{ vars.AML_DEPLOYMENT_NAME }}' does not exist."
            echo "It will be created."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi


      # -------------------------------------------------------
      # A brand-new deployment needs the referenced Azure ML
      # environment to exist. Reuse it if already registered.
      # -------------------------------------------------------

      - name: Ensure inference environment exists
        if: steps.deployment_state.outputs.exists == 'false'
        shell: bash
        run: |
          ENV_FILE="azureml/environment-py314.yml"

          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::Missing $ENV_FILE"
            exit 1
          fi

          ENV_NAME=$(grep -m1 '^name:' "$ENV_FILE" | cut -d':' -f2- | xargs | tr -d "\"'")
          ENV_VERSION=$(grep -m1 '^version:' "$ENV_FILE" | cut -d':' -f2- | xargs | tr -d "\"'")

          if [ -z "$ENV_NAME" ] || [ -z "$ENV_VERSION" ]; then
            echo "::error::$ENV_FILE must contain top-level name and version values."
            exit 1
          fi

          echo "Inference environment: $ENV_NAME:$ENV_VERSION"

          if az ml environment show \
            --name "$ENV_NAME" \
            --version "$ENV_VERSION" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --output none 2>/dev/null; then

            echo "Environment already exists. Reusing it."
          else
            echo "Environment does not exist. Creating it from $ENV_FILE"

            az ml environment create \
              --file "$ENV_FILE" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
              --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
              --output none
          fi


      # -------------------------------------------------------
      # Resolve the deployment template only when BLUE is missing.
      #
      # Expected placeholders in azureml/deployment-v1.template.yml:
      #   __DEPLOYMENT_NAME__
      #   __ENDPOINT_NAME__
      #   __MODEL_REFERENCE__
      # -------------------------------------------------------

      - name: Prepare new deployment YAML
        id: deployment_yaml
        if: steps.deployment_state.outputs.exists == 'false'
        shell: bash
        run: |
          TEMPLATE="azureml/deployment-v1.yml"
          RESOLVED_FILE="$RUNNER_TEMP/deployment-v1-resolved.yml"

          if [ ! -f "$TEMPLATE" ]; then
            echo "::error::Missing $TEMPLATE"
            exit 1
          fi

          MODEL_REFERENCE="${{ steps.model_reference.outputs.reference }}"
          DEPLOYMENT_NAME="${{ vars.AML_DEPLOYMENT_NAME }}"
          ENDPOINT_NAME="${{ vars.AML_ENDPOINT_NAME }}"

          sed \
            -e "s|__DEPLOYMENT_NAME__|$DEPLOYMENT_NAME|g" \
            -e "s|__ENDPOINT_NAME__|$ENDPOINT_NAME|g" \
            -e "s|__MODEL_REFERENCE__|$MODEL_REFERENCE|g" \
            "$TEMPLATE" > "$RESOLVED_FILE"

          if grep -Eq '__[A-Z0-9_]+__' "$RESOLVED_FILE"; then
            echo "::error::Unresolved placeholder found in deployment YAML:"
            grep -En '__[A-Z0-9_]+__' "$RESOLVED_FILE" || true
            exit 1
          fi

          echo "Resolved deployment YAML:"
          cat "$RESOLVED_FILE"

          echo "file=$RESOLVED_FILE" >> "$GITHUB_OUTPUT"


      # -------------------------------------------------------
      # CREATE BLUE when it does not exist.
      #
      # --all-traffic is appropriate for this POC because BLUE is
      # the active deployment behind the stable endpoint/APIM path.
      # -------------------------------------------------------

      - name: Create new Azure ML deployment
        if: steps.deployment_state.outputs.exists == 'false'
        shell: bash
        run: |
          echo "Creating deployment: ${{ vars.AML_DEPLOYMENT_NAME }}"
          echo "Model: ${{ steps.model_reference.outputs.reference }}"

          az ml online-deployment create \
            --name "${{ vars.AML_DEPLOYMENT_NAME }}" \
            --endpoint-name "${{ vars.AML_ENDPOINT_NAME }}" \
            --file "${{ steps.deployment_yaml.outputs.file }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --all-traffic


      # -------------------------------------------------------
      # UPDATE BLUE when it already exists.
      #
      # Only the registered model reference changes. The endpoint,
      # environment, instance configuration and data collector remain.
      # -------------------------------------------------------

      - name: Update existing Azure ML deployment
        if: steps.deployment_state.outputs.exists == 'true'
        shell: bash
        run: |
          MODEL_REFERENCE="${{ steps.model_reference.outputs.reference }}"

          echo "Updating deployment: ${{ vars.AML_DEPLOYMENT_NAME }}"
          echo "New model: $MODEL_REFERENCE"

          az ml online-deployment update \
            --name "${{ vars.AML_DEPLOYMENT_NAME }}" \
            --endpoint-name "${{ vars.AML_ENDPOINT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --set model="$MODEL_REFERENCE"


      # -------------------------------------------------------
      # Verify deployment
      # -------------------------------------------------------

      - name: Verify deployment
        run: |

          az ml online-deployment show \
            --name "${{ vars.AML_DEPLOYMENT_NAME }}" \
            --endpoint-name "${{ vars.AML_ENDPOINT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --query "{Name:name,State:provisioning_state,Model:model}" \
            -o table


      # -------------------------------------------------------
      # Azure ML smoke test
      # -------------------------------------------------------

      - name: Test Azure ML endpoint
        run: |

          az ml online-endpoint invoke \
            --name "${{ vars.AML_ENDPOINT_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --workspace-name "${{ vars.AZURE_ML_WORKSPACE }}" \
            --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            --request-file sample_request.json