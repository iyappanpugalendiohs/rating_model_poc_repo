name: Deploy to Azure ML
on:
  workflow_dispatch:
    inputs:
      deployment_file:
        description: Azure ML deployment YAML
        required: true
        default: azureml/deployment-v1.yml
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate model package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure ML CLI extension
        run: |
          az extension add -n ml -y
          az extension update -n ml
      - name: Configure workspace defaults
        run: |
          az configure --defaults group=${{ vars.AZURE_RESOURCE_GROUP }} workspace=${{ vars.AZURE_ML_WORKSPACE }} location=${{ vars.AZURE_LOCATION }}
      - name: Create endpoint if missing
        run: |
          az ml online-endpoint show -n ue-rating-model-endpoint || az ml online-endpoint create -f azureml/endpoint.yml
      - name: Deploy model
        run: |
          az ml online-deployment create -f ${{ github.event.inputs.deployment_file }} --all-traffic
      - name: Smoke test Azure ML endpoint
        run: |
          az ml online-endpoint invoke -n ue-rating-model-endpoint --request-file sample_request.json
