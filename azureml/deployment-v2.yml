$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: green
endpoint_name: ue-rating-model-endpoint
description: Registered Rating Model v2 canary on Python 3.14 BYOC runtime.
model: azureml:ue-rating-model:2
model_mount_path: /var/ue-model
environment: azureml:ue-rating-py314:1
instance_type: Standard_DS2_v2
instance_count: 1
app_insights_enabled: true
request_settings:
  request_timeout_ms: 5000
  max_concurrent_requests_per_instance: 2
