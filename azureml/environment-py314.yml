$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: ue-rating-py314
version: 1
description: UE Rating Model Python 3.14 BYOC environment with Azure ML model data collection SDK.
build:
  path: ./docker
  dockerfile_path: Dockerfile
inference_config:
  liveness_route:
    port: 8080
    path: /health
  readiness_route:
    port: 8080
    path: /ready
  scoring_route:
    port: 8080
    path: /score
